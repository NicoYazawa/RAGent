name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + coverage gate)
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      RAGENT_TEST_ES_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      # pytest.ini already sets --cov=app --cov-fail-under=90:
      # below 90% coverage the run fails, so deleting tests cannot turn the build green
      - name: Run tests (coverage gate >= 90%)
        working-directory: backend
        run: python -m pytest -q
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + vitest + coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build (vue-tsc + vite)
        working-directory: frontend
        run: npm run build
      # vitest.config.ts already sets coverage.thresholds (statements/lines >= 90):
      # falling short fails the run, so deleting tests cannot turn the build green
      - name: Run tests (coverage gate >= 90%)
        working-directory: frontend
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
