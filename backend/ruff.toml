# Ruff configuration — goal: make "test anti-patterns" fail in CI instead of waiting for human review
#
# Rules kept (directly tied to test effectiveness):
#   F401 / F841   unused import / variable — usually a copied test that was never finished
#   B011 / B015   assert False / useless comparison — dead assertions
#   B904          raise inside except without from — lost exception chain
#   I001          import order — less review noise
#   RUF100        invalid noqa
#   E9 / F        syntax-level issues and undefined names
#
# Always-true assertions (such as `assert ("a", b) or any(...)`) are caught by the AST
# static checks in tests/test_test_quality.py (ruff has no rule for them); that is the real gate.
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "data", "scripts", "__pycache__"]

[lint]
select = ["E9", "F", "W", "I", "B", "C4", "PT", "SIM", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job
    "B008",    # FastAPI Depends() in a default value is the standard style
    "RUF001",  # Chinese full-width punctuation
    "RUF002",
    "RUF003",
    "SIM105",  # contextlib.suppress is not always clearer
    "SIM108",  # a ternary is not always clearer
    "SIM300",  # yoda conditions
    "PT006",   # a comma-separated parametrize name is easier to read
    "PT011",   # some tests match broadly on purpose (several ValueError sources)
    "PT018",   # compound assertions are preferred for readability
    "RUF005",
    "RUF015",
    "RUF059",
    "E741",
]

[lint.per-file-ignores]
# tests may use magic numbers as assertions (that is the expected value itself)
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["S101", "T201", "B008"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
