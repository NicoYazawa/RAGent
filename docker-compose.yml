services:
  web:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      # Inside the container the dependencies are reached by service name
      - MYSQL_HOST=db
      - ES_URL=http://es:9200
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      es:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DB}
      # Allow root connections from the compose network (other containers); by default only localhost is allowed
      - MYSQL_ROOT_HOST=%
    volumes:
      - db_data:/var/lib/mysql
      - ./ragent_init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Demo default password, bound to the loopback address only: local clients on the host can connect,
    # while the LAN and the internet cannot. Change it to "3306:3306" to expose it.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  es:
    # Pulling docker.elastic.co timed out on the first attempt in this environment (large layers);
    # a retry usually resumes and completes.
    # For Chinese IK analysis, switch back to build (see elasticsearch/Dockerfile), but confirm the
    # IK plugin URL is reachable first. es.py falls back to the standard analyzer when IK is missing.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # Also bound to the loopback address only (the ES index holds knowledge-base source text and must
    # not be exposed to the LAN).
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  db_data:
  es_data:
  uploads:
